<section>
  <h2>Courses</h2>
  <label for="search-courses">Search courses</label>
  <input id="search-courses" type="text" [(ngModel)]="searchTerm" placeholder="Search courses..." />

  <p *ngIf="loading">Loading courses...</p>
  <p class="error-text" *ngIf="error">{{ error }}</p>

  <div class="course-grid" *ngIf="!loading && !error">
    <app-course-card
      *ngFor="let course of filteredCourses"
      [name]="course.name"
      [code]="course.code"
      [credits]="course.credits"
      [grade]="course.grade">
    </app-course-card>
  </div>

  <p *ngIf="!loading && !error && filteredCourses.length === 0">No courses found.</p>
</section>
